  <style>
    :root{
      --bg:#000;
      --fg:#d9ffd9;
      --hi:#7dff7d;
      --dim:#3f7f3f;
      --line:#0f2e0f;
      --mono:"Share Tech Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:var(--mono);
      text-transform:uppercase;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }
    /* faint grid + scanlines */
    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 64px,
        linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/64px 100%;
      opacity:.45;
    }
    body::after{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:2;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
    }
    main{
      position:relative;z-index:1;
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 2.5vw;
    }
    .panel{
      position:relative;
      padding:1.6rem 1.8rem 1.4rem;
      border:1px solid var(--line);
      background:rgba(0,0,0,.6);
    }
    /* corner brackets */
    .panel::before,.panel::after{
      content:"";position:absolute;width:14px;height:14px;
      border-color:var(--hi);border-style:solid;
    }
    .panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
    .panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
    .panel h1{
      margin:0 0 1.1rem;
      font-size:clamp(.85rem,1.1vw,1.05rem);
      font-weight:400;
      letter-spacing:.3em;
      color:var(--hi);
    }
    .panel h1::before{
      content:"";display:inline-block;width:.55em;height:.55em;margin-right:.7em;
      background:var(--hi);border-radius:50%;vertical-align:middle;
      box-shadow:0 0 8px var(--hi);
      animation:blink 1.6s steps(1) infinite;
    }
    @keyframes blink{50%{opacity:.15}}
    .rows{
      display:grid;
      grid-template-columns:auto auto;
      column-gap:2rem;
      row-gap:.15rem;
      font-size:clamp(1.3rem,2.1vw,2.2rem);
      line-height:1.25;
      font-variant-numeric:tabular-nums;
    }
    .rows .k{color:var(--dim);letter-spacing:.12em}
    .rows .v{text-align:right;min-width:2ch;color:var(--fg);text-shadow:0 0 12px rgba(125,255,125,.35)}
    .stamp{
      margin-top:1.2rem;
      padding-top:.8rem;
      border-top:1px solid var(--line);
      font-size:clamp(.7rem,.9vw,.85rem);
      letter-spacing:.14em;
      color:var(--dim);
      white-space:nowrap;
    }
    .stamp span{color:var(--hi)}
    .center{
      position:absolute;
      left:50%;top:50%;
      transform:translate(-50%,-50%);
      font-size:clamp(1.6rem,3.6vw,3.8rem);
      letter-spacing:.06em;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
      color:var(--hi);
      text-shadow:0 0 18px rgba(125,255,125,.45);
    }
    @media (max-width:900px){
      main{
        flex-direction:column;
        justify-content:center;
        gap:2.5rem;
        padding:3rem 1.25rem;
      }
      .center{
        position:static;transform:none;
        order:0;
      }
      .panel{order:1;width:min(100%,22rem)}
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-label="Decade Closed">
      <h1>Decade Closed</h1>
      <div class="rows">
        <span class="k">YEARS:</span><span class="v" id="d-y">–</span>
        <span class="k">MONTHS:</span><span class="v" id="d-mo">–</span>
        <span class="k">DAYS:</span><span class="v" id="d-d">–</span>
        <span class="k">HOURS:</span><span class="v" id="d-h">–</span>
        <span class="k">MINUTES:</span><span class="v" id="d-mi">–</span>
        <span class="k">SECONDS:</span><span class="v" id="d-s">–</span>
      </div>
      <div class="stamp">END: <span id="end-stamp"></span></div>
    </section>

    <div class="center" aria-label="Target">$1,000,000,000.00</div>

    <section class="panel" aria-label="Time in LA">
      <h1>Time in LA</h1>
      <div class="rows">
        <span class="k">YEARS:</span><span class="v" id="l-y">–</span>
        <span class="k">MONTHS:</span><span class="v" id="l-mo">–</span>
        <span class="k">DAYS:</span><span class="v" id="l-d">–</span>
        <span class="k">HOURS:</span><span class="v" id="l-h">–</span>
        <span class="k">MINUTES:</span><span class="v" id="l-mi">–</span>
        <span class="k">SECONDS:</span><span class="v" id="l-s">–</span>
      </div>
      <div class="stamp">START: <span id="start-stamp"></span></div>
    </section>
  </main>

  <script>
    (function(){
      var TZ = 'America/Los_Angeles';

      // Wall-clock moments in Los Angeles.
      var START = { y:2025, mo:9, d:1, h:16, mi:30, s:0 };
      var END   = { y:2035, mo:9, d:1, h:16, mi:30, s:0 };

      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: TZ, hourCycle: 'h23',
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit'
      });

      function laParts(date){
        var o = {};
        fmt.formatToParts(date).forEach(function(p){ o[p.type] = p.value; });
        return {
          y: +o.year, mo: +o.month, d: +o.day,
          h: +o.hour % 24, mi: +o.minute, s: +o.second
        };
      }

      function daysInMonth(y, mo){ // mo is 1-12
        return new Date(Date.UTC(y, mo, 0)).getUTCDate();
      }

      function toKey(p){
        return Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s);
      }

      // Calendar difference from wall-clock a to wall-clock b (a <= b).
      function diff(a, b){
        if (toKey(b) < toKey(a)) return { y:0, mo:0, d:0, h:0, mi:0, s:0 };
        var y = b.y - a.y, mo = b.mo - a.mo, d = b.d - a.d,
            h = b.h - a.h, mi = b.mi - a.mi, s = b.s - a.s;
        if (s < 0){ s += 60; mi--; }
        if (mi < 0){ mi += 60; h--; }
        if (h < 0){ h += 24; d--; }
        if (d < 0){
          var pm = b.mo - 1, py = b.y;
          if (pm < 1){ pm = 12; py--; }
          d += daysInMonth(py, pm);
          mo--;
        }
        if (mo < 0){ mo += 12; y--; }
        return { y:y, mo:mo, d:d, h:h, mi:mi, s:s };
      }

      function pad(n){ return (n < 10 ? '0' : '') + n; }

      function stamp(p){
        return p.y + '-' + pad(p.mo) + '-' + pad(p.d) + ' ' +
               pad(p.h) + ':' + pad(p.mi) + ':' + pad(p.s);
      }

      var el = {};
      ['d-y','d-mo','d-d','d-h','d-mi','d-s',
       'l-y','l-mo','l-d','l-h','l-mi','l-s'].forEach(function(id){
        el[id] = document.getElementById(id);
      });

      function set(prefix, v){
        el[prefix + '-y'].textContent  = v.y;
        el[prefix + '-mo'].textContent = pad(v.mo);
        el[prefix + '-d'].textContent  = pad(v.d);
        el[prefix + '-h'].textContent  = pad(v.h);
        el[prefix + '-mi'].textContent = pad(v.mi);
        el[prefix + '-s'].textContent  = pad(v.s);
      }

      document.getElementById('start-stamp').textContent = stamp(START);
      document.getElementById('end-stamp').textContent   = stamp(END);

      function tick(){
        var now = laParts(new Date());
        set('d', diff(now, END));
        set('l', diff(START, now));
      }

      tick();
      // Align updates to the wall-clock second.
      setTimeout(function(){
        tick();
        setInterval(tick, 1000);
      }, 1000 - (Date.now() % 1000));
    })();
  </script>
</body>
