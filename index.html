  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --accent:#9900FF;
      --border:rgba(255,255,255,.14);
      --shadow:0 10px 30px rgba(0,0,0,.45);
      --caret-y:0.20em;
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
      font-weight:700;
      -webkit-font-smoothing:antialiased;
      overflow:hidden; /* desktop: lock viewport */
    }

    /* The reading view fills the viewport from the first paint. */
    .home-header,
    #site-footer{ display:none; }

    .wrap{
      box-sizing:border-box;
      position:fixed;
      inset:0;
      height:100vh;
      height:100dvh;
      display:grid;
      place-items:center;
      text-align:center;
      padding:calc(64px + env(safe-area-inset-top, 0px))
              calc(24px + env(safe-area-inset-right, 0px))
              calc(64px + env(safe-area-inset-bottom, 0px))
              calc(24px + env(safe-area-inset-left, 0px));
    }

    .hero{
      width:100%;
      max-width:1200px;
      min-width:0;
      user-select:text;
    }

    .line{
      margin:0;
      letter-spacing:.2px;
      line-height:1.05;
      font-size:clamp(28px,6vw,72px);
      text-shadow:0 0 10px rgba(153,0,255,.18),0 0 35px rgba(153,0,255,.12);
      white-space:pre-wrap;
      opacity:0;
      transition:opacity .6s ease-in-out; /* fade in/out whole line */
    }

    .accent{ color:var(--accent); }

    .fadeout{
      position:fixed;
      inset:0;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition:opacity 1.5s ease;
      z-index:999;
    }
    .fadeout.active{ opacity:1; }

    .flash { animation: fadePulse 2.6s ease-in-out infinite alternate; }
    @keyframes fadePulse { from { opacity:.28 } to { opacity:1 } }

    .viewer-controls{
      position:fixed;
      top:calc(12px + env(safe-area-inset-top, 0px));
      right:calc(12px + env(safe-area-inset-right, 0px));
      z-index:1000;
      display:flex;
      gap:8px;
      pointer-events:none;
    }

    body[data-controls-visible="true"] .viewer-button,
    body[data-paused="true"] #playback-toggle,
    .viewer-button:focus-visible{
      opacity:1;
      pointer-events:auto;
    }

    .viewer-button{
      opacity:0;
      pointer-events:none;
      transition:opacity .15s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:44px;
      padding:10px 14px;
      border:1px solid var(--border);
      border-radius:999px;
      background:rgba(0,0,0,.8);
      color:var(--fg);
      font-family:inherit;
      font-size:13px;
      font-weight:500;
      line-height:1.2;
      cursor:pointer;
    }
    .viewer-button[hidden]{ display:none; }
    .viewer-button:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:4px;
    }
    .viewer-button svg{ width:16px; height:16px; }
    body[data-controls-visible="false"][data-paused="false"] .wrap{ cursor:none; }
    body[data-paused="true"] .line{
      opacity:1 !important;
      transition:none;
      animation-play-state:paused;
    }
    body[data-paused="true"] .fadeout{ opacity:0; transition:none; }
    #playback-toggle .play-icon{ display:none; }
    body[data-paused="true"] #playback-toggle .pause-icon{ display:none; }
    body[data-paused="true"] #playback-toggle .play-icon{ display:block; }
    .line{ overflow-wrap:anywhere; }

    @media (min-width:768px){
      .wrap{
        padding-left:calc(48px + env(safe-area-inset-left, 0px));
        padding-right:calc(48px + env(safe-area-inset-right, 0px));
      }
    }
    @media (prefers-reduced-motion:reduce){
      .viewer-button{ transition:none; }
    }
  </style>

<body>
  <!-- STATIC header (Contact only) -->
  <header class="home-header" role="banner" aria-label="Home header">
  </header>

  <div class="wrap">
    <div class="hero" id="hero" aria-live="polite" aria-atomic="true">
      <h1 class="line" id="line">
        <span> </span><span class="accent"></span><span>.</span>
      </h1>
    </div>

  </div>

  <div id="site-footer"></div>

  <div id="fade" class="fadeout"></div>

  <script>
    (function () {
      var target = document.getElementById('site-footer');
      if (!target) return;

      fetch('/footer.html', { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load footer');
          return res.text();
        })
        .then(function (html) {
          target.innerHTML = html;
        })
        .catch(function (err) {
          console.error('Footer load error:', err);
        });
    })();
  </script>

  <div class="viewer-controls" role="group" aria-label="Reading controls">
    <button id="playback-toggle" class="viewer-button" type="button"
            aria-label="Pause messages" aria-keyshortcuts="Space" title="Pause messages (Space)">
      <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M8 5v14M16 5v14" />
      </svg>
      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="m8 5 11 7-11 7z" />
      </svg>
      <span id="playback-label">Pause</span>
    </button>
    <button id="fullscreen-toggle" class="viewer-button" type="button"
            aria-label="Enter fullscreen" aria-pressed="false" aria-keyshortcuts="F"
            title="Enter fullscreen (F). Escape exits." hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
      </svg>
      <span id="fullscreen-label">Fullscreen</span>
    </button>
  </div>

  <script>
  (function(){
    const root = document.documentElement;
    const stage = document.querySelector('.wrap');
    const button = document.getElementById('fullscreen-toggle');
    const label = document.getElementById('fullscreen-label');
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    const enabled = root.requestFullscreen ? document.fullscreenEnabled : document.webkitFullscreenEnabled;

    let idleTimer;
    let pending = false;
    let firstInteraction = true;
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;

    function revealControls(){
      document.body.dataset.controlsVisible = 'true';
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.body.dataset.controlsVisible = 'false';
      }, 700);
    }

    function syncFullscreen(){
      const active = !!fullscreenElement();
      if (active) firstInteraction = false;
      button.setAttribute('aria-pressed', String(active));
      button.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
      button.title = active ? 'Exit fullscreen (F or Escape)' : 'Enter fullscreen (F). Escape exits.';
      label.textContent = active ? 'Exit fullscreen' : 'Fullscreen';
      revealControls();
    }

    async function enterFullscreen(){
      if (pending || fullscreenElement()) return;
      pending = true;
      try {
        // Most browsers require a gesture; an allowed automatic request can succeed here too.
        await (root.requestFullscreen ? request.call(root, { navigationUI:'hide' }) : request.call(root));
      } catch (_) {
        // The full-viewport reading view remains usable when fullscreen is denied.
      } finally {
        pending = false;
      }
    }

    async function toggleFullscreen(){
      firstInteraction = false;
      if (fullscreenElement()) {
        try { await exit.call(document); } catch (_) { /* Keep the current view. */ }
      } else {
        await enterFullscreen();
      }
    }

    // Playback controls remain available even without the Fullscreen API.
    document.addEventListener('pointermove', revealControls, { passive:true });
    document.addEventListener('pointerdown', revealControls, { passive:true });
    document.addEventListener('keydown', revealControls);
    document.addEventListener('focusin', revealControls);
    revealControls();
    if (!request || !exit || enabled === false) return;

    button.hidden = false;
    button.addEventListener('click', toggleFullscreen);
    stage.addEventListener('click', () => {
      if (!firstInteraction || !window.getSelection().isCollapsed) return;
      firstInteraction = false;
      enterFullscreen();
    });
    document.addEventListener('keydown', event => {
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey ||
          event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (event.key.toLowerCase() === 'f') {
        event.preventDefault();
        toggleFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', syncFullscreen);
    document.addEventListener('webkitfullscreenchange', syncFullscreen);
    syncFullscreen();
    enterFullscreen();
  })();
  </script>

  <script>
  (function(){
    const lineEl = document.getElementById('line');

    const stage = document.querySelector('.wrap');
    function fitLine(){
      lineEl.style.fontSize = '';
      const style = getComputedStyle(stage);
      const availableHeight = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      const availableWidth = document.getElementById('hero').clientWidth;
      let size = parseFloat(getComputedStyle(lineEl).fontSize);
      while (size > 12 && (lineEl.scrollHeight > availableHeight || lineEl.scrollWidth > availableWidth)) {
        lineEl.style.fontSize = `${--size}px`;
      }
    }
    if ('ResizeObserver' in window) new ResizeObserver(fitLine).observe(stage);
    else window.addEventListener('resize', fitLine);

    const msgs = [

      {text:`A coward dies a thousand deaths.`,accent:`.`},
      {text:`Nothing worth having is ever given to you.`,accent:`given`},
      {text:`Please exit the circus.`,accent:`.`}      
    ];

    const FINAL_LINE = 'Just Win.';
    const FADE_IN = 600;
    const FADE_OUT = 600;
    const HOLD = 1000;

    const playbackButton = document.getElementById('playback-toggle');
    const playbackLabel = document.getElementById('playback-label');
    const fade = document.getElementById('fade');
    // Shuffle once per page load; navigation only moves this cursor.
    const order = shuffle(msgs);
    let currentIndex = 0;
    let paused = false;
    let waiting = null;
    let pointerWasPaused = null;
    document.body.dataset.paused = 'false';

    function armWait(){
      const pending = waiting;
      pending.started = performance.now();
      pending.timer = setTimeout(() => {
        if (waiting !== pending) return;
        waiting = null;
        pending.callback();
      }, pending.remaining);
    }

    function cancelWait(){
      if (waiting) clearTimeout(waiting.timer);
      waiting = null;
    }

    function wait(ms, callback){
      cancelWait();
      waiting = { remaining:ms, callback, started:0, timer:null };
      if (!paused) armWait();
    }

    function setPaused(next){
      if (paused === next) return;
      paused = next;
      if (waiting) {
        if (paused) {
          clearTimeout(waiting.timer);
          waiting.remaining = Math.max(0, waiting.remaining - (performance.now() - waiting.started));
        } else {
          armWait();
        }
      }
      document.body.dataset.paused = String(paused);
      const action = paused ? 'Resume' : 'Pause';
      playbackLabel.textContent = action;
      playbackButton.setAttribute('aria-label', `${action} messages`);
      playbackButton.title = `${action} messages (Space)`;
    }

    function hasSelectedMessage(){
      const selection = window.getSelection();
      return selection && !selection.isCollapsed && selection.rangeCount > 0 &&
        selection.getRangeAt(0).intersectsNode(lineEl);
    }

    playbackButton.addEventListener('click', () => setPaused(!paused));
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
          event.target.closest('input, textarea, select, [contenteditable]')) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        navigate(event.key === 'ArrowLeft' ? -1 : 1);
      } else if (event.code === 'Space' && !event.repeat && !event.target.closest('button, a')) {
        event.preventDefault();
        setPaused(!paused);
      }
    });
    // Freeze on press so the message cannot change while a selection is being dragged.
    stage.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      pointerWasPaused = paused;
      setPaused(true);
    });
    stage.addEventListener('pointercancel', () => { pointerWasPaused = null; });
    stage.addEventListener('click', () => {
      const next = pointerWasPaused === null ? !paused : !pointerWasPaused;
      pointerWasPaused = null;
      setPaused(hasSelectedMessage() || next);
    });
    document.addEventListener('selectionchange', () => {
      if (hasSelectedMessage()) setPaused(true);
    });

    function parts(m){
      const a = m.accent;
      if(!a) return [{str:m.text, isAccent:false}];
      const i = m.text.indexOf(a);
      if(i < 0) return [{str:m.text, isAccent:false}];
      return [
        {str:m.text.slice(0,i), isAccent:false},
        {str:a, isAccent:true},
        {str:m.text.slice(i + a.length), isAccent:false}
      ];
    }

    function buildHTML(m){
      const toks = parts(m);
      let out = '';
      for(const t of toks){
        out += t.isAccent ? `<span class="accent">${t.str}</span>` : t.str;
      }
      return out;
    }

    function showCurrent(immediate = false){
      // Cancel the previous hold/fade before rendering, including while paused.
      cancelWait();
      if (immediate) fade.style.transition = 'none';
      fade.classList.remove('active');
      if (immediate) {
        void fade.offsetWidth;
        fade.style.transition = '';
      }
      lineEl.style.transition = '';
      lineEl.classList.remove('flash');
      if (currentIndex === order.length) {
        if (immediate) showFinal();
        else {
          fade.classList.add('active');
          wait(2000, showFinal);
        }
        return;
      }

      if (immediate) lineEl.style.transition = 'none';
      lineEl.style.opacity = 0;
      lineEl.innerHTML = buildHTML(order[currentIndex]);
      fitLine();
      void lineEl.offsetWidth;
      lineEl.style.opacity = 1;
      if (immediate) {
        void lineEl.offsetWidth;
        lineEl.style.transition = '';
      }

      wait(FADE_IN + HOLD, () => {
        lineEl.style.opacity = 0;
        wait(FADE_OUT, () => {
          currentIndex++;
          showCurrent();
        });
      });
    }

    function navigate(direction){
      const next = Math.max(0, Math.min(order.length, currentIndex + direction));
      if (next === currentIndex) return;
      currentIndex = next;
      showCurrent(true);
    }

    function shuffle(a){
      const arr = a.slice();
      for(let i = arr.length - 1; i > 0; i--){
        const j = (Math.random() * (i + 1)) | 0;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showFinal(){
      lineEl.style.transition = 'none';
      lineEl.style.opacity = 1;
      lineEl.classList.add('flash');
      lineEl.innerHTML = FINAL_LINE;
      fitLine();

      fade.classList.remove('active');
    }

    showCurrent();
  })();
  </script>
</body>
